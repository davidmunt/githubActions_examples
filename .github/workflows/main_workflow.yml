name: main_workflow
on:
  push:
    branches:
      - nodejs_jest_job
jobs:
  linter-execution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Linter execution
        uses: github/super-linter@v6
        env:
          DEFAULT_BRANCH: nodejs_jest_job
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINTER_RULES_PATH: /
          JAVASCRIPT_ES_CONFIG_FILE: .eslintrc.json
          VALIDATE_JAVASCRIPT_ES: true
  test-execution:
    runs-on: ubuntu-latest
    needs: linter-execution
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
      - name: Install Jest
        uses: npm install jest --legacy-peer-deps
      - name: Run Jest Test
        uses: npm run test
